


<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>印刷流水號全能計算器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:微軟正黑體,sans-serif;}
body{background:#f5f7fa;padding:20px;max-width:580px;margin:0 auto;}
.box{background:#fff;padding:25px;border-radius:12px;box-shadow:0 2px 10px #ddd;}
h2{text-align:center;color:#222;margin-bottom:20px;}
.item{margin:15px 0;}
label{display:block;margin-bottom:6px;color:#444;font-weight:bold;}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:16px;}
.tip{font-size:13px;color:#888;margin-top:4px;}
.btn{width:100%;padding:12px;background:#1677ff;color:#fff;border:none;border-radius:6px;font-size:17px;margin-top:10px;cursor:pointer;}
.btn:hover{background:#0e5fc9;}
.res{margin-top:20px;padding:15px;background:#f6faff;border-radius:8px;line-height:2;font-size:16px;}
.batch1{border-left:4px solid #009966;padding:8px;margin:10px 0;}
.batch2{border-left:4px solid #d83030;padding:8px;margin:10px 0;}
.redtxt{color:#d83030;font-weight:bold;}
.greentxt{color:#009966;font-weight:bold;}
</style>
</head>
<body>
<div class="box">
<h2>流水號倒跳計算器</h2>

<div class="item">
<label>上次結束號碼(續印填寫)</label>
<input type="number" id="lastEndNo" placeholder="空白預設從0001開始">
<div class="tip">全新單子留空，續印填最後結束號</div>
</div>

<div class="item">
<label>是否拆分兩批印刷</label>
<select id="splitSel">
<option value="1">需要分批(預防跳號故障)</option>
<option value="0">不分批一次性印完</option>
</select>
</div>

<div class="item">
<label>客戶需求本數</label>
<input type="number" id="needCnt" value="200">
</div>

<div class="item">
<label>紙張類型</label>
<select id="typeSel">
<option value="100">模造紙(1本=100號)</option>
<option value="50" selected>非碳紙(1本=50號)</option>
</select>
</div>

<div class="item">
<label>一版幾模</label>
<input type="number" id="moCnt" value="6">
</div>

<button class="btn" onclick="runCalc()">開始計算</button>
<div class="res" id="showRes"></div>
</div>

<script>
function pad4(n){
return String(n).padStart(4,'0');
}

function getModList(maxNum, perMod, totalMod, startBase){
let arr = [];
let curr = maxNum;
for(let i=1;i<=totalMod;i++){
let end = curr - perMod + 1;
arr.push({s:curr, e:end});
curr = end - 1;
}
return arr;
}

function runCalc(){
let lastEnd = document.getElementById('lastEndNo').value.trim();
let isSplit = parseInt(document.getElementById('splitSel').value);
let needBook = parseInt(document.getElementById('needCnt').value);
let perBookNo = parseInt(document.getElementById('typeSel').value);
let mod = parseInt(document.getElementById('moCnt').value);

// 起始號
let startBase = lastEnd === "" ? 1 : (parseInt(lastEnd) + 1);

// 補整為模數倍數
let rem = needBook % mod;
let totalPrintBook = rem === 0 ? needBook : needBook + (mod - rem);
let totalAllNo = totalPrintBook * perBookNo;
let perModNum = totalAllNo / mod;

let html = `<strong>📋 基礎資訊</strong><br>`;
html += `接續起始號：${pad4(startBase)}<br>`;
html += `需求本數：${needBook} 本｜補整實印：${totalPrintBook} 本<br>`;
html += `單本號數：${perBookNo}｜單模號數：${perModNum}<br>`;
html += `每版固定 ${mod} 模｜印刷方式：${isSplit?'拆分兩批':'一次性全印'}<hr>`;

if(isSplit === 0){
// 不分批 一次性印完
let endAll = startBase + totalAllNo - 1;
let maxCurr = endAll;
let list = getModList(maxCurr, perModNum, mod);
html += `<div class="batch1"><strong class="greentxt">整批一次性印刷</strong>（${pad4(startBase)} ~ ${endAll}）<br>`;
list.forEach((item,idx)=>{
html += `第${idx+1}模：${item.s} ＞ ${pad4(item.e)}<br>`;
});
html += `</div>`;
}else{
// 分批 均分兩批
let splitBook = totalPrintBook / 2;
let oneBatchNo = splitBook * perBookNo;

// 第一批
let b1End = startBase + oneBatchNo - 1;
let list1 = getModList(b1End, perModNum, mod);
html += `<div class="batch1"><strong class="greentxt">第一批 ${splitBook} 本</strong>（${pad4(startBase)} ~ ${b1End}）<br>`;
list1.forEach((item,idx)=>{
html += `第${idx+1}模：${item.s} ＞ ${pad4(item.e)}<br>`;
});
html += `</div>`;

// 第二批
let b2Start = b1End + 1;
let b2End = b1End + oneBatchNo;
let list2 = getModList(b2End, perModNum, mod);
html += `<div class="batch2"><strong class="redtxt">第二批 ${splitBook} 本</strong>（${b2Start} ~ ${b2End}）<br>`;
list2.forEach((item,idx)=>{
html += `第${idx+1}模：${item.s} ＞ ${pad4(item.e)}<br>`;
});
html += `</div>`;
}
document.getElementById('showRes').innerHTML = html;
}
</script>
</body>
</html>
