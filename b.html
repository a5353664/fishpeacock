<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>印刷大紙採購數量計算機</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:微軟正黑體,sans-serif;}
body{background:#f5f7fa;padding:20px;max-width:500px;margin:0 auto;}
.box{background:#fff;padding:25px;border-radius:12px;box-shadow:0 2px 10px #ddd;}
h2{text-align:center;color:#222;margin-bottom:20px;}
.item{margin:15px 0;}
label{display:block;margin-bottom:6px;color:#444;font-weight:bold;}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:16px;}
.btn{width:100%;padding:12px;background:#2980b9;color:#fff;border:none;border-radius:6px;font-size:17px;margin-top:10px;cursor:pointer;}
.btn:hover{background:#1f6aa3;}
.res{margin-top:20px;padding:15px;background:#ecf7ff;border-radius:8px;line-height:1.8;font-size:16px;}
</style>
</head>
<body>
<div class="box">
    <h2>印刷叫紙數量計算器</h2>

    <div class="item">
        <label>印製本數</label>
        <input type="number" id="ben" placeholder="輸入幾本">
    </div>

    <div class="item">
        <label>紙張類型</label>
        <select id="type">
            <option value="100">模造紙(1本=100張)</option>
            <option value="50">非碳紙(1本=50份)</option>
        </select>
    </div>

    <div class="item">
        <label>一版幾模</label>
        <input type="number" id="mo" value="4">
    </div>

    <div class="item">
        <label>大紙開數(菊4開填4)</label>
        <input type="number" id="kai" value="4">
    </div>

    <button class="btn" onclick="calc()">開始計算</button>

    <div class="res" id="result"></div>
</div>

<script>
function calc(){
    let ben = Number(document.getElementById('ben').value);
    let dan = Number(document.getElementById('type').value);
    let mo = Number(document.getElementById('mo').value);
    let kai = Number(document.getElementById('kai').value);

    let totalSmall = ben * dan;
    let bigPaper = totalSmall / mo / kai;
    // 無條件進位
    let needBig = Math.ceil(bigPaper);
    let ling = Math.floor(needBig / 500);
    let zhang = needBig % 500;

    let html = `
總需求小張數：${totalSmall}<br>
實際需採購大紙張數：<font color="red">${needBig} 張</font><br>
換算令數：<font color="#0066cc">${ling} 令 ${zhang} 張</font>
    `;
    document.getElementById('result').innerHTML = html;
}
</script>
</body>
</html>
